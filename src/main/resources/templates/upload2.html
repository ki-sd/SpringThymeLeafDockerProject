<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<style type="text/css">
.container{
	margin-top: 50px;
}
.orw{
	margin: 0px auto;
	width: 500px
}
</style>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body>
	<div class="container">
		<div class="row">
			<h3 class="text-center">Vue를 이용한 멀티 업로드</h3>
			<input type="file" size="20" style="float: left" multiple @change="handlerFile">
			<button @click="submit" class="btn-sm btn-primary" style="float: left">업로드</button>
		</div>
	</div>
<script>
	const app=Vue.createApp({
		data(){
			return{
				files:[]
			}
		},
		methods:{
			submit(){
				const formData=new FormData()
				for(let i of this.files){
					formData.append('files',i)
				}
				console.log(formData)
				axios.post('/multi-upload',formData,{
					headers:{
						'Context-Type':'multipart/form-data'
					}
				}).then(response=>{
					alert("등록완료")
				})
			},
			handlerFile(e){
				this.files=e.target.files
				console.log(this.files)
			}
		}
	}).mount('.container')
</script>
</body>
</html>
