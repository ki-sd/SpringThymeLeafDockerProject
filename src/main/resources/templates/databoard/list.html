<!DOCTYPE html>
<html>
<style>
.row{
	margin: 0px auto;
	width: 900px
}
h3{
	text-align: center
}
.table td{
	text-overflow: ellipsis;
	overflow: hidden;
	white-space: nowrap;
}
</style>
	<div class="container">
		<div class="row">
			<h3>ThymeLeaf 자료실</h3>
			<table class="table">
				<tr>
					<td class="text-left">
						<a href="/databoard/insert" class="btn btn-sm btn-success">등록</a>
					</td>
				</tr>
			</table>
			<table class="table">
				<tr class="success">
					<th width="10%" class="text-center">번호</th>
					<th width="45%" class="text-center">제목</th>
					<th width="15%" class="text-center">작성자</th>
					<th width="20%" class="text-center">작성일</th>
					<th width="10%" class="text-center">조회수</th>
				</tr>
				<tr th:each="vo,iterStat:${list}">
					<td width="10%" class="text-center" th:text="${count-iterStat.index}">1</td>
					<td width="45%">[[${vo.subject}]]</td>
					<td width="15%" class="text-center">[[${vo.name}]]</td>
					<td width="20%" class="text-center">[[${vo.dbday}]]</td>
					<td width="10%" class="text-center">[[${vo.hit}]]</td>
				</tr>
				<tr>
					<td colspan="5" class="text-center">
						<ul class="pagination">
							<li th:if="${startPage>1}"><a th:href="@{/databoard/list(page=${startPage-1})}">&laquo;</a></li>
							<li th:each="i:${#numbers.sequence(startPage,endPage)}" th:class="${curpage==i?'active':''}"><a th:href="@{/databoard/list(page=${i})}">[[${i}]]</a></li>
							<li th:if="${endPage<totalpage}"><a th:href="@{/databoard/list(page=${endPage+1})}">&raquo;</a></li>
						</ul>
					</td>
				</tr>
			</table>
		</div>
	</div>
</html>
